<!DOCTYPE html>

    <style>
        /* CSS リセットとモバイル最適化 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 580px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UIオーバーレイ共通 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            color: white;
            z-index: 10;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* スタート画面を明るめにアレンジ */
        #start-layer.show {
            background: rgba(255, 240, 200, 0.95);
            color: #333;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        #ui-layer h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: bold;
            color: #666;
        }

        #final-score {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
            color: #ffd700;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b39700;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b39700;
        }

        #start-btn {
            background: #ffaa00;
            box-shadow: 0 6px 0 #cc8800;
            color: white;
        }

        #start-btn:active {
            box-shadow: 0 0 0 #cc8800;
        }
    </style>
</head>

            function drawSingleAnimalBody(x, y, rankInfo, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.arc(0, 0, rankInfo.radius, 0, 2 * Math.PI);
                ctx.fillStyle = rankInfo.color;
                ctx.fill();
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                const fontSize = rankInfo.radius * 1.1; 
                ctx.font = `${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(rankInfo.emoji, 0, fontSize * 0.05);

                ctx.restore();
            }

            function cleanUpReservations() {
                const currentIds = new Set(activeBodies.map(b => b.id));
                for (let id in mergeReservations) {
                    if (!currentIds.has(Number(id))) {
                        delete mergeReservations[id];
                    }
                }
            }
        } catch (e) {
            console.error("Critical error in main block:", e);
        }

    </script>
</body>
