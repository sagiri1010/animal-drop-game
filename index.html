<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>どうぶつ合体パズル</title>
    <!-- Matter.js 0.19.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        /* CSS リセットとモバイル最適化 */
        * {
            box-sizing: border-box;
            user-select: none;
            /* テキスト選択禁止 */
            -webkit-user-select: none;
            /* Safari用 */
            -webkit-touch-callout: none;
            /* 長押しメニュー禁止 */
            -webkit-tap-highlight-color: transparent;
            /* タップハイライト非表示 */
            margin: 0;
            padding: 0;
        }

        body {
            /* 背景はわかりやすくグレーめに */
            background-color: #333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none;
            /* スクロール防止 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 580px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            /* 丸みをつける */
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ゲームオーバー用のオーバーレイ */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* 通常時はクリックなどを貫通させる */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            color: white;
            z-index: 10;
        }

        /* ゲームオーバー時に付与するクラス */
        #ui-layer.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            /* ボタンクリックを有効化 */
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #final-score {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
            color: #ffd700;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b39700;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b39700;
        }
    </style>
</head>

<body>

        <div id="ui-layer">
            <h1>ゲームオーバー</h1>
            <div id="final-score">Score: 0</div>
            <button id="retry-btn">リトライ</button>
        </div>

        let mergeReservations = {};

        /**

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Matter.js エンジンの初期化
            engine = Engine.create();
            // 重力を少しだけ強くしてパズル感を出す
            engine.gravity.y = 1.2;

            // 容器（壁・床）の作成
            const floorY = CANVAS_HEIGHT - DICT_HEIGHT;
            const floor = Bodies.rectangle(
                CANVAS_WIDTH / 2,

           const leftWall = Bodies.rectangle(

               { isStatic: true,renderType: 'wall' }

           const rightWall = Bodies.rectangle(

               { isStatic: true,renderType: 'wall' }
           );

            // Worldに追加
           Composite.add(engine.world, [floor, leftWall, rightWall]);

            // 最初に出現するどうぶつを抽選
            currentAnimalRank = getRandomSpawnRank();
            nextAnimalRank = getRandomSpawnRank();

            // イベントの設定（マウス・タッチ・衝突）
            setupEvents();

            // 物理エンジンの実行
            runner = Runner.create();
            Runner.run(runner, engine);

            // 描画ループ開始
            requestAnimationFrame(renderLoop);
        }

        /**
         * =========================================

                random -= SPAWN_WEIGHTS[i].weight;
     f (random <= 0) {
                    return SPAWN_WEIGHTS[i].rank;
                }
            }
            return 0; // フェールセーフ
        }

        function createAnimalBody(x, y, rankId) {
            const rankInfo = RANKS[rankId];
            const body = Bodies.circle(x, y, rankInfo.radius, {
                restitution: 0.2, 
                friction: 0.5, 
                density: 0.001 * (rankId + 1),
                customRankId: rankId,
                renderType: 'animal'
            });
            Composite.add(enine.world, body);
            activeBodies.push(body);
           return body;
        }

        /**
         * =========================================
         * 5. 落下処理
         * =========================================
         */
        function handleInputMove(x) {
            if (isGameOver) return;
            const currentRadius = RANKS[currentAnimalRank].radius;
            const minX = WALL_THICKNESS + currentR                     nst maxX = CANVAS_WIDTH - WALL_THICKNESS - c         ius;

                   function handleDrop() {
            if (isGameOver) return;
            
            const now = Date.now();
            if (now - lastDropTime < DROP_COOLDOWN) return;

            createAnimalBody(mouseX, 40, currentAnimalRank);

            currentAnimalRank = nextAnimalRank;
            nextAnimalRank = getRandomSpawnRank()  
            handleInputMove(mouseX);

            lastDropTime = now;
        }

        function setupEvents() {
            // -- PC --
            canvas.addEventListener('mousemove',              const rect = canvas.getBoundingClientRect();
                handleInputMove(e.clientX - rect.left);
            });
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) handleDrop();
            });

            // -- iPad / スマホ --
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefa            if (!e.touches || e.touches.length === 0) return;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                handleInputMove(touch.clientX - rect.left);
            }, { passive: false });
            
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleDrop();
            }, { passive: false });

            // Matter.js の衝突イベント
            Events.on(engine, 'collisionStart', handleCollision);
        }

        /**
         * =========================================
         * 6. 合体・消去処理
         * =========================================
         */
        function handleCollision(event) {
            if (isGameOver) return;
            const pairs = event.pairs;

            let bodiesToRemove = [];
            let bodiesToAdd =      for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                if (bodyA.renderType !== 'animal' || bodyB.renderType !== 'animal') continue;

                // ランクが同じ場合
                if (         tomRankId === bodyB.customRankId) {
                    const r         odyA.customRankId;
                    
                    if (mergeReservations[bodyA.id] || mergeReservations[bodyB.id]) continue;

                    mergeReservations[bodyA.id] = true;
                    mergeReservations[bodyB.id] = true;

                    // スコア加算
                    score += RANKS[rankId].score;

                    // 古い2つを削除対象に
                    bodiesToRemove.push(bodyA, bodyB);

                    // ランク5未満なら次のレベルを生成。ランク5なら生成せず消えるだけ
                    if (rankId < RANKS.length - 1) {
                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;

       iesToAdd.push({
                            x: midX,
                            y: midY,
                            rankId: rankId + 1
                        });
                    } else {
                        // ライオン(5)同士の場合は消去される。特別エフェクトなどはなしでそのまま消える
                    }
                }
            }

            if (bodiesToRemove.length > 0) {
                Composite.remove(engine.world, bodiesToRemove);
                const removeIds = new Set(bodiesToRemove.map(b => b.id));
                activeBodies = activeBodies.filter(b => !removeIds.has(b.id));

                bodiesToAdd.forEach(data => {
                    const newBody = createAnimalBody(data.x, data.y, data.rankId);
                    
                    Matter.Body.setVelocity(newBody, {
                        x: (Math.random() - 0.5) * 2,
                        y: (Math.random() - 0.5) * 2
                    });
                });
            }
        }

        /**
         * =========================================
         * 7. ゲームオーバー処理
         * =========================================
         */
        function checkGameOver() {
            if (isGameOver) return;

            lefalse;
            
            for (let body of activeBodies) {
                const radius = RANKS[body.customRankId].radius;
                const topEdgeY = body.position.y - radius;
                
                const velocityMag = Math.sqrt(body.velocity.x ** 2 + body.velocity.y ** 2);
                
                if (topEdgeY < DEADLINE_.0) {

                }
            }

            if (hasViolator) {

                    deadlineViolationStartTime = Date.now();
                } else {
                    if (Date.now() - de        olat         ime > GAME_OVER_TIME) {
                             erGameOver();
                    }
                }
            }                        deadlineViolationStartTime = null;
            }
        }

        function triggerGameOver() {
 sGameOver = true;
            Runner.stop(runner); 
            
            document.getElementById('final-score').innerText = `Score: ${score}`;
            document.getElementById('ui-layer').classList.add('show');
        }

        /**
         * =========================================
     
         * =========================================
         */
        document.getElementById('retry-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').classList.remove('show');
            resetGame();
     function resetGame() {
            Composite.remove(engine.world, activeBodies);
            activeBodies = [];
            mergeReservations = {};
            deadlineViolationStartTime = null;

            score = 0;
            currentAnimalRank = getRandomSpawnRank();
            nextAnimalRank = getRandomSpawnRank();
            lastDropTime = 0;
            isGameOver = false;

            Runner.run(runner, engine);
            handleInputMove(CANVAS_WIDTH / 2);
        }

        /**

            // 背景クリア
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT - DICT_HEIGHT);
            
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, CANVAS_HEIGHT - DICT_HEIGHT, CANVAS_WIDTH, DICT           if (!isGameOver) {
                checkGameOver();
            }

            cleanUpReservations();

            drawWalls();

            drawAct        ls()              drawInputGuideline();
            drawU                  requ         ionFrame(renderLoop);
        }

        fun         wWalls() {
            ctx.fillStyle = '#d4a97a'; // 茶色系
            const bodies = Composite.allBodies(engine.world);
            
            for (let body of bodies) {
                if (body.renderType === 'wall') {
                    const width = body.bounds.max.x - body.bounds.min.x;
                    const height = body.bounds.max.y - body.bounds.min.y;
                    
                    ctx.beginPath();
                    ctx.roundRect(
                        body.position.x - width/2, 
                        body.position.y - height/2, 
                        width, 
                        height, 
                        10 
                    );
                    ctx.fill();
                  }
        }

         function drawUI() {

        function drawSingleAnimalBody(x, y, rankInfo, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.arc(0, 0, rankInfo.radius, 0, 2 * Math.PI);
            ctx.fillStyle = rankInfo.color;
            ctx.fill();
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            const fontSize = rankInfo.radius * 1.1; 
            ctx.font = `${fontSize}px Arial`;

        function cleanUpReservations() {
            const currentIds = new Set(activeBodies.map(b => b.id));
            for (let id in mergeReservations) {
                if (!currentIds.has(Number(id))) {
                    delete mergeReservations[id];
                }
            }
